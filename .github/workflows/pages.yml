name: Deploy to GitHub Pages

# Builds the page and publishes it through the GitHub Pages Actions pipeline on
# every push to main. Repo Settings → Pages → Source must be "GitHub Actions".
# The server (server/) is deployed separately: `cd server && npx wrangler deploy`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken course replay or room flow blocks the deploy.
      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundle
        run: npm run build

      # Only the static site, with the short sha on bundle.js so browsers never
      # keep a stale bundle after a deploy.
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          HASH=$(git rev-parse --short HEAD)
          sed "s|dist/bundle.js|dist/bundle.js?v=${HASH}|g" index.html > _site/index.html
          cp dist/bundle.js _site/dist/
          cp -r assets icons manifest.webmanifest _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
